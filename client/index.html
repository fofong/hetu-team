<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hetu Team</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{--qqbar:#1c2739;--list:#f7f8fa;--list-sel:#dfe4ec;--chat:#f5f6f7;--border:#e2e4e8;--me:#b9dcff;--txt:#171b21;--sub:#9aa1ab;--qq:#12b7f5;--red:#fa5151}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 -apple-system,"PingFang SC",sans-serif;color:var(--txt);display:flex;overflow:hidden;background:var(--chat)}
/* ① 最左深色图标栏 */
#iconbar{width:56px;background:var(--qqbar);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px;flex:none}
#iconbar .me-avatar{width:36px;height:36px;border-radius:8px;overflow:hidden;flex:none;margin-bottom:8px}
#iconbar .me-avatar img{width:100%;height:100%;object-fit:cover}
#iconbar .brand{color:#6d7891;font-size:10px;writing-mode:vertical-rl;letter-spacing:2px;margin-top:auto;padding-bottom:6px}
#iconbar .tab{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#8a93a5;cursor:pointer;position:relative}
#iconbar .tab.on{background:#33405a;color:#fff}
#iconbar .tab .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red);display:none}
#iconbar .bot-gap{margin-top:auto}
/* ② 列表栏（会话/联系人/任务） */
#list{width:264px;background:var(--list);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
#list .top{padding:12px 14px;display:flex;align-items:center;gap:8px}
#list .top input{flex:1;border:0;border-radius:4px;background:#e4e6ea;padding:5px 9px;font:inherit;font-size:12px;color:#556;outline:none}
#list .top .add{width:24px;height:24px;border-radius:4px;background:#e4e6ea;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#556}
.pane{flex:1;overflow-y:auto;display:none}
.pane.on{display:block}
.conv{display:flex;gap:10px;padding:11px 12px;cursor:pointer;position:relative}
.conv:hover{background:#e9ebef}
.conv.active{background:var(--list-sel)}
.conv.pinned{background:#eceff4}
.conv .av{width:40px;height:40px;border-radius:6px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.conv .av.agent{background:#ffb266}
.conv .mid{flex:1;min-width:0}
.conv .nm{display:flex;justify-content:space-between;font-size:14px}
.conv .nm time{color:var(--sub);font-size:11px;font-weight:normal}
.conv .pv{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .badge{position:absolute;top:9px;right:38px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 4px}
.conv .badge.muted{background:#b6bcc6}
/* 联系人 */
.sec{padding:9px 14px;color:#59616e;font-size:13px;background:#eef0f4;cursor:pointer;user-select:none}
.frow{display:flex;gap:10px;padding:8px 12px 8px 26px;cursor:pointer;align-items:center}
.frow:hover{background:#e9ebef}
.frow .av{width:32px;height:32px;border-radius:6px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;position:relative}
.frow .av.agent{background:#ffb266}
.frow .av .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid var(--list)}
.frow .st{margin-left:auto;color:var(--sub);font-size:11px}
.tag{background:#fff1e6;color:#d46b08;border-radius:3px;padding:0 4px;margin-left:4px;font-size:11px}
/* 任务 */
.trow{padding:10px 14px;border-bottom:1px solid #eef0f3;cursor:pointer}
.trow:hover{background:#eef4fa}
.trow .tt{font-size:13px;display:flex;justify-content:space-between;gap:6px}
.trow .meta{color:var(--sub);font-size:12px;margin-top:2px;display:flex;align-items:center;gap:8px}
.st-badge{border-radius:3px;padding:0 6px;font-size:11px;color:#fff}
.st-queued{background:#8f9bb3}.st-running{background:#12b7f5}.st-completed{background:#ff9a3d}.st-accepted{background:#22c55e}
/* ③ 聊天区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:10px;flex:none;position:relative}
#head .title b{font-size:15px}
#head .title small{display:block;color:var(--sub);font-size:11px}
#head .rightbox{margin-left:auto;display:flex;align-items:center;gap:14px;color:#6b7280}
#head .tools span{cursor:pointer;font-size:16px}
#status{font-size:12px;color:var(--sub)}
#status .on{color:#22c55e}
#annbar{background:#fff7e0;border-bottom:1px solid #f5e6bd;padding:6px 16px;font-size:12px;color:#8a6116;display:none;align-items:center;gap:8px;flex:none}
#annbar .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#annbar a{color:#b8860b;cursor:pointer;flex:none}
#pinbar{background:#eef6ff;border-bottom:1px solid #d7e9fb;padding:6px 16px;font-size:12px;color:#146fd4;display:none;align-items:center;gap:8px;flex:none;cursor:pointer}
#pinbar .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.rxchip{background:#f0f2f5;border:1px solid #e3e6ea;border-radius:9px;padding:1px 7px;font-size:12px;cursor:pointer;color:#456}
.rxchip:hover{border-color:var(--qq)}
.rxchip.mine{background:#e3f2ff;border-color:#9fd0f5;color:#146fd4}
.recall-note{color:#9aa1ab;font-size:12px}
.thinking .bubble{color:#57606c}
.thinking .dots::after{content:'…';animation:dk 1s infinite}
@keyframes dk{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.srow{display:flex;gap:8px;padding:8px 4px;border-bottom:1px dashed #eef0f3;font-size:13px;cursor:pointer}
.srow:hover{background:#f2f8ff}
.srow .who2{color:var(--sub);flex:none;font-size:12px;width:86px;overflow:hidden;white-space:nowrap}
.srow .tx2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column}
.msg{display:flex;gap:10px;max-width:76%;margin-bottom:14px}
.msg.cont{margin-top:-8px}
.msg.cont .avatar,.msg.cont .who{visibility:hidden;height:0;margin:0}
.msg .avatar{width:40px;height:40px;border-radius:6px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;cursor:pointer}
.msg.agent .avatar{background:#ffb266}
.msg .c{min-width:0}
.msg .who{font-size:12px;color:var(--sub);margin-bottom:3px}
.msg .who .more{display:none;margin-left:8px;cursor:pointer;color:#c0c6cf}
.msg:hover .who .more{display:inline}
.bubble{background:#fff;border-radius:8px;padding:9px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word;position:relative;white-space:normal}
.msg:not(.me):not(.sys) .bubble::before{content:'';position:absolute;left:-4px;top:13px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-radius:2px}
.msg.me .bubble::before{content:'';position:absolute;right:-4px;top:13px;width:10px;height:10px;background:var(--me);transform:rotate(45deg);border-radius:2px}
.timecut{align-self:center;color:var(--sub);font-size:11px;padding:2px 6px;margin-bottom:10px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .who{text-align:right}
.msg.me .avatar{background:#52b788}
.msg.me .bubble{background:var(--me)}
.msg.sys{align-self:center;max-width:90%}
.msg.sys .bubble{background:#eceff3;color:var(--sub);font-size:12px;box-shadow:none}
.quote{background:#f0f2f5;border-left:3px solid #c6ccd6;border-radius:4px;padding:4px 8px;margin-bottom:6px;font-size:12px;color:#57606c;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quote:hover{background:#e8ebef}
.at{color:#146fd4}
.flash{animation:fl 1.2s}
@keyframes fl{0%,60%{background:#ffe9a8}100%{}}
/* 输入区 */
#inputwrap{background:#fff;border-top:1px solid var(--border);flex:none;position:relative}
#quotebar{display:none;padding:6px 14px;background:#f6f8fa;border-top:1px solid #eef0f3;font-size:12px;color:#57606c;align-items:center;gap:8px}
#quotebar .x{cursor:pointer;color:var(--sub)}
#toolbar{height:38px;display:flex;align-items:center;gap:16px;padding:0 14px;color:#6b7280;font-size:16px;border-bottom:1px solid #f0f1f3}
#toolbar span{cursor:pointer}
#toolbar .right{margin-left:auto;display:flex;gap:14px}
#text{width:100%;border:0;padding:10px 14px;resize:none;height:88px;font:inherit;outline:none}
#sendrow{display:flex;justify-content:flex-end;padding:6px 14px 12px}
#sendrow button{border:0;border-radius:4px;background:#fff;color:#333;font:inherit;padding:5px 22px;cursor:pointer;border:1px solid #d5d8dd}
#sendrow button:hover{color:var(--qq);border-color:var(--qq)}
/* @成员选择器 */
#atbox{position:absolute;left:14px;bottom:130px;width:250px;max-height:240px;overflow-y:auto;background:#fff;border:1px solid #dfe2e8;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:none;z-index:40}
#atbox .it{display:flex;gap:8px;align-items:center;padding:7px 12px;cursor:pointer;font-size:13px}
#atbox .it.sel,#atbox .it:hover{background:#eef4fb}
#atbox .it .av{width:26px;height:26px;border-radius:5px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
#atbox .it .av.agent{background:#ffb266}
#atbox .it small{color:var(--sub);margin-left:auto;font-size:11px;max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* 表情面板 */
#emoji{position:absolute;left:10px;bottom:130px;width:300px;background:#fff;border:1px solid #dfe2e8;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.14);display:none;z-index:40;padding:10px;grid-template-columns:repeat(10,1fr)}
#emoji span{font-size:20px;text-align:center;cursor:pointer;padding:3px 0;border-radius:4px}
#emoji span:hover{background:#eef4fb}
/* ④ 群成员侧栏 */
#members{width:210px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex:none}
#members.hidden{display:none}
#members .mhead{font-size:13px;padding:12px 14px 6px;color:var(--sub)}
#members .msearch{padding:0 12px 8px}
#members .msearch input{width:100%;border:0;background:#f0f2f5;border-radius:4px;padding:4px 8px;font:inherit;font-size:12px;outline:none}
#memlist{flex:1;overflow-y:auto}
.memsec{padding:6px 14px 2px;color:#9aa1ab;font-size:11px}
.mem{padding:7px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;position:relative}
.mem:hover{background:#f6f8fb}
.mem .av{width:28px;height:28px;border-radius:5px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;position:relative}
.mem .av.agent{background:#ffb266}
.mem .av .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.mem small{color:var(--sub);display:block;font-size:11px;max-width:120px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mem .more{margin-left:auto;color:#c0c6cf;cursor:pointer;visibility:hidden}
.mem:hover .more{visibility:visible}
#memfoot{border-top:1px solid #f0f1f3;display:flex;justify-content:space-around;padding:9px 0;color:#6b7280;font-size:16px}
#memfoot span{cursor:pointer}
/* 个人名片 */
#card{position:fixed;z-index:50;width:300px;background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.18);display:none;overflow:hidden}
#card .cover{height:64px;background:linear-gradient(120deg,#b7e3fb,#d8f1ff)}
#card .body{display:flex;gap:12px;padding:0 16px 12px;margin-top:-26px}
#card .cav{width:56px;height:56px;border-radius:8px;border:2px solid #fff;background:#ffb266;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#card .cav.human{background:#7aa5ff}
#card .cinfo{padding-top:26px;min-width:0}
#card .cname{font-size:16px;font-weight:600}
#card .cno{color:var(--sub);font-size:12px}
#card .csign{padding:0 16px 12px;color:#57606c;font-size:13px;border-bottom:1px solid #f0f1f3;white-space:pre-wrap;max-height:66px;overflow:auto}
#card .acts{display:flex;justify-content:flex-end;gap:14px;padding:9px 16px}
#card .acts a{color:var(--qq);font-size:13px;cursor:pointer;text-decoration:none}
#card .acts a:hover{text-decoration:underline}
/* 模态 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:none;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:8px;width:460px;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal h3{font-size:15px;padding:14px 18px;border-bottom:1px solid #f0f1f3;display:flex;justify-content:space-between}
.modal h3 span{cursor:pointer;color:var(--sub)}
.modal .mbody{padding:14px 18px;overflow-y:auto}
.modal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.modal textarea,.modal input,.modal select{width:100%;border:1px solid #d5d8dd;border-radius:4px;padding:7px 9px;font:inherit;font-size:13px;outline:none}
.modal textarea:focus,.modal input:focus{border-color:var(--qq)}
.modal .mfoot{padding:12px 18px;display:flex;justify-content:flex-end;gap:10px;border-top:1px solid #f0f1f3}
.modal .mfoot button{border:0;border-radius:4px;padding:6px 18px;font:inherit;cursor:pointer;background:#f0f1f3;color:#333}
.modal .mfoot .pri{background:var(--qq);color:#fff}
.modal h4{font-size:13px;margin:16px 0 6px;color:#333}
.btn-s{border:0;border-radius:3px;background:#eef1f5;color:#333;font-size:12px;padding:2px 8px;cursor:pointer}
.btn-s.pri{background:var(--qq);color:#fff}
.btn-s.danger{background:#fee;color:#d33}
.memrow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #eef0f3;font-size:13px}
.memrow .tx{flex:1;word-break:break-word}
.memrow .del{color:var(--sub);cursor:pointer;flex:none}
.memrow .del:hover{color:var(--red)}
.memadd{display:flex;gap:8px;margin-top:12px}
.memadd input{flex:1}
.arow{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed #eef0f3;font-size:13px}
.arow .nm2{flex:1}
.arow small{color:var(--sub)}
/* 右键菜单 */
#ctx{position:fixed;z-index:70;background:#fff;border:1px solid #e2e4e8;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.16);display:none;min-width:120px;padding:4px 0;font-size:13px}
#ctx div{padding:6px 18px;cursor:pointer}
#ctx div:hover{background:#eef4fb}
/* toast */
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(30,35,45,.88);color:#fff;border-radius:6px;padding:8px 18px;font-size:13px;display:none;z-index:90}
  .att-img img{max-width:260px;border-radius:8px;display:block;margin:4px 0;cursor:zoom-in}
  .att-file{display:flex;gap:10px;align-items:center;background:#f7f8fa;border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:4px 0;min-width:190px}
  .att-file b{font-size:13px}
  .att-file small{color:var(--fg3);margin-left:8px}
  .att-file a{margin-left:auto;color:var(--blue);text-decoration:none;font-size:15px}
  .me-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bd);cursor:pointer}
  .me-row:hover{background:#f7f8fa}
  .me-row .av{width:36px;height:36px;border-radius:7px;background:linear-gradient(135deg,#12b7f5,#6c5ce7);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}
  .me-row small{display:block;color:var(--fg3);font-size:11px}
  .frow.sel{background:#e8f4fd}
  .frow small{display:block;color:var(--fg3);font-size:11px}
  .sec .fold{display:inline-block;width:12px;color:var(--fg3);font-size:9px;transition:transform .15s}
  .sec.folded .fold{transform:rotate(-90deg)}
</style>
</head>
<body>
<div id="iconbar">
  <div class="me-avatar" title="Hetu Team · HongYun Lab"><img src="logo.jpg" alt="Hetu Team"></div>
  <div class="tab on" id="tab-msg" title="消息" onclick="switchTab('msg')">💬<span class="dot" id="msgdot"></span></div>
  <div class="tab" id="tab-contacts" title="联系人" onclick="switchTab('contacts')">👥</div>
  <div class="tab" id="tab-tasks" title="任务" onclick="switchTab('tasks')">📋</div>
  <div class="tab bot-gap" title="关于" onclick="toast('Hetu Team · HongYun Lab · MIT')">⚙️</div>
  <div class="brand">HongYun Lab</div>
</div>
<div id="list">
  <div class="top"><input id="searchbox" placeholder="搜索" oninput="onSearch(this.value)"><div class="add" onclick="addMenu(event)" title="添加">＋</div></div>
  <div class="pane on" id="pane-msg"></div>
  <div class="pane" id="pane-contacts"></div>
  <div class="pane" id="pane-tasks"></div>
</div>
<div id="main">
  <div id="head">
    <div class="title"><b id="gname">—</b><small id="gsub"></small></div>
    <span class="rightbox"><span class="tools">
      <span title="搜索聊天记录" onclick="openSearch()">🔍</span>
      <span title="聊天记录" onclick="toast('UI 先行：聊天记录面板未接入（P1）')">🕘</span>
      <span title="群设置" id="adminbtn" onclick="openAdmin()">⚙️</span>
    </span><span id="status">● <span class="on">连接中</span></span></span>
  </div>
  <div id="annbar">📢 <span class="tx" id="anntext"></span><a onclick="event.stopPropagation();openAdmin()">编辑</a><a onclick="hideAnn()">✕</a></div>
  <div id="pinbar" onclick="if(PIN_MID)jumpMsg(PIN_MID)">📌 <span class="tx" id="pintext"></span></div>
  <div id="msgs"></div>
  <div id="inputwrap">
    <div id="quotebar">🗨 回复 <span id="qtxt"></span><a style="color:var(--qq);cursor:pointer;font-size:12px" onclick="quoteAsTask()">引用为任务</a><span class="x" onclick="clearReply()">✕</span></div>
    <div id="toolbar">
      <span title="表情" onclick="toggleEmoji(event)">😀</span>
      <span title="图片" onclick="pickFile('image/*')">🖼️</span>
      <span title="文件" onclick="pickFile('')">📁</span>
      <span title="截图" onclick="toast('UI 先行：截图未接入（P2）')">✂️</span>
      <span title="语音" onclick="toast('UI 先行：语音未接入（P2）')">🎤</span>
      <span title="聊天记录" onclick="openSearch()">🕘</span>
      <span class="right">
        <span title="消息免打扰" id="mutebtn" onclick="toggleMute()">🔕</span>
      </span>
    </div>
    <textarea id="text" placeholder="输入消息，Enter 发送，Shift+Enter 换行，@ 唤起成员选择"></textarea>
    <div id="sendrow"><button onclick="send()">发送(S)</button></div>
    <div id="atbox"></div>
    <div id="emoji"></div>
  </div>
</div>
<div id="members">
  <div class="mhead" id="memtitle">群成员</div>
  <div class="msearch"><input placeholder="搜索群成员" oninput="renderMembers(this.value)"></div>
  <div id="memlist"></div>
  <div id="memfoot">
    <span title="群文件" onclick="groupFiles()">📁</span>
    <span title="群相册" onclick="toast('UI 先行：群相册未接入（P2）')">🖼️</span>
    <span title="群公告" onclick="openAdmin()">📢</span>
    <span title="聊天记录" onclick="openSearch()">🕘</span>
  </div>
</div>
<div id="card"></div>
<div id="ctx"></div>
<div id="toast"></div>
<div class="mask" id="mask" onclick="if(event.target===this)closeModals()">
  <div class="modal" id="modal"></div>
</div>
<script>
const API = new URLSearchParams(location.search).get('server') || (location.port === '8877' ? location.origin : 'http://10.66.10.2:8877');
const ME = '沣锅';
const MODES = [['default_silent','默认静默'],['default_single','默认单应答'],['free_discussion','自由讨论'],['collaborative','协同执行'],['independent_review','独立评审']];
const $ = id => document.getElementById(id);
let gid = null, lastSeq = 0, ws = null, MEMBERS = [], GROUPS = [], MSGS = {}, REPLY = null, TAB = 'msg', priv = false, ANN_HIDDEN = new Set();

function LS(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } }
function SLS(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
async function j(url, opt){ const r = await fetch(API+url, opt); return r.json(); }
async function jp(url, body){ return j(url, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function tms(t){ if(t==null) return 0; const n=Number(t); if(!isNaN(n)&&n>0) return n<1e12?n*1000:n; const d=new Date(t); return isNaN(d)?0:d.getTime(); }
function hhmm(t){ const ms=tms(t); if(!ms) return ''; const d = new Date(ms); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function oneLine(s){ return String(s).replace(/\s+/g,' ').slice(0,60); }
let toastTimer=null;
function toast(t){ const el=$('toast'); el.textContent=t; el.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display='none',2200); }
function isPrivate(g){ return /^与.+的私聊$/.test(g.name); }
function modeCN(m){ const x=MODES.find(x=>x[0]===m); return x?x[1]:m; }

// ---- 拼音首字母（QQ 式匹配）----
let COLL=null; try{ COLL=new Intl.Collator('zh-Hans-CN-u-co-pinyin'); }catch(e){}
const PB=[['z','匝'],['y','压'],['x','昔'],['w','挖'],['t','塌'],['s','撒'],['r','然'],['q','期'],['p','啪'],['o','哦'],['n','拿'],['m','妈'],['l','垃'],['k','喀'],['j','击'],['h','哈'],['g','噶'],['f','发'],['e','蛾'],['d','哒'],['c','擦'],['b','芭'],['a','阿']];
function initial(ch){ if(/[a-z0-9]/i.test(ch)) return ch.toLowerCase(); if(!COLL||!/[\u4e00-\u9fa5]/.test(ch)) return ''; for(const [l,b] of PB){ if(COLL.compare(ch,b)>=0) return l; } return ''; }
function initials(n){ return Array.from(String(n)).map(initial).join(''); }
function matchMember(m,q){ if(!q) return true; q=q.toLowerCase(); return m.name.toLowerCase().includes(q) || initials(m.name).startsWith(q); }

// ---- Tab 切换 ----
function switchTab(t){
  TAB=t;
  for(const k of ['msg','contacts','tasks']){ $('tab-'+k).classList.toggle('on',k===t); $('pane-'+k).classList.toggle('on',k===t); }
  if(t==='contacts') renderContacts();
  if(t==='tasks') renderTasks();
}
function onSearch(v){ if(TAB==='contacts') renderContacts(v); }

// ---- 会话列表 ----
async function loadConvs(){
  let gs = await j('/groups');
  if(!gs.length){ const g = await jp('/groups',{name:'Hetu 研发群',mode:'default_single'}); gs=[g]; }
  GROUPS = gs;
  const seen=LS('ht_seen',{}), pins=LS('ht_pins',{}), mutes=LS('ht_mutes',{});
  const items=[];
  for(const g of gs){
    const ms = await j(`/groups/${g.group_id}/messages`);
    const last = ms[ms.length-1];
    const unread = ms.filter(m=>(seen[g.group_id]||0)<m.group_seq && m.sender!==ME);
    const un = unread.length;
    const atMe = unread.some(m=>((m.mentions&&m.mentions.humans)||[]).length || m.text.includes('@'+ME) || m.text.includes('@全体'));
    items.push({g, pv: last?`${last.sender}: ${oneLine(last.text)}`:'（暂无消息）', t: last?last.created_at:'', un, atMe});
  }
  items.sort((a,b)=>(pins[b.g.group_id]?1:0)-(pins[a.g.group_id]?1:0) || tms(b.t)-tms(a.t));
  let total=0;
  $('pane-msg').innerHTML = items.map(({g,pv,t,un,atMe})=>{
    if(g.group_id!==gid && !mutes[g.group_id]) total+=un;
    const muted=!!mutes[g.group_id];
    return `<div class="conv ${g.group_id===gid?'active':''} ${pins[g.group_id]?'pinned':''}" onclick="openGroup('${g.group_id}')" oncontextmenu="convMenu(event,'${g.group_id}')">
      <div class="av">${esc((isPrivate(g)?g.name.replace(/^与/,'').replace(/的私聊$/,''):g.name)[0]||'群')}</div>
      <div class="mid"><div class="nm"><b>${esc(g.name)}</b><time>${hhmm(t)}</time></div>
      <div class="pv">${muted?'🔕 ':''}${esc(pv)}</div></div>
      <div class="badge ${muted?'muted':''}" style="display:${un?'flex':'none'}">${atMe?'@':(un>99?'99+':un)}</div></div>`;
  }).join('');
  $('msgdot').style.display = total?'block':'none';
  if(!gid && gs.length) openGroup(gs[0].group_id);
}
function convMenu(ev, id){
  ev.preventDefault(); ev.stopPropagation();
  const pins=LS('ht_pins',{}), mutes=LS('ht_mutes',{});
  showCtx(ev, [
    pins[id]?'取消置顶':'置顶该会话',
    mutes[id]?'取消免打扰':'消息免打扰',
    '标记为已读',
  ], i=>{
    if(i===0){ pins[id]=!pins[id]?1:0; SLS('ht_pins',pins); }
    if(i===1){ mutes[id]=!mutes[id]?1:0; SLS('ht_mutes',mutes); }
    if(i===2){ const seen=LS('ht_seen',{}); const ms=GROUPS.find(g=>g.group_id===id); seen[id]=999999; SLS('ht_seen',seen); }
    loadConvs();
  });
}
function toggleMute(){ const m=LS('ht_mutes',{}); m[gid]=m[gid]?0:1; SLS('ht_mutes',m); toast(m[gid]?'已开启免打扰':'已关闭免打扰'); loadConvs(); }
function hideAnn(){ ANN_HIDDEN.add(gid); renderAnnounce(); }
function renderAnnounce(){
  const g=GROUPS.find(x=>x.group_id===gid);
  const show = g && g.announcement && g.announcement.text && !priv && !ANN_HIDDEN.has(gid);
  $('annbar').style.display = show?'flex':'none';
  if(show) $('anntext').textContent = g.announcement.text;
}

// ---- 打开会话 ----
async function openGroup(id){
  gid=id; lastSeq=0; lastTimeCut=0; lastSender=null; REPLY=null; renderQuote(); MSGS={};
  $('msgs').innerHTML='';
  const gs = await j('/groups'); GROUPS=gs;
  const g = gs.find(x=>x.group_id===id); if(!g) return;
  priv = isPrivate(g);
  $('members').classList.toggle('hidden', priv);
  $('adminbtn').style.display = priv?'none':'';
  const who = priv? g.name.replace(/^与/,'').replace(/的私聊$/,'') : g.name;
  $('gname').textContent = who;
  $('gsub').textContent = priv? '在线' : `群号: ${g.group_id.slice(0,8).toUpperCase()} · ${modeCN(g.mode)}`;
  $('pinbar').style.display='none'; PIN_MID=null; clearThinking();
  renderAnnounce(); loadPins();
  const ms = await j(`/groups/${id}/messages`);
  ms.forEach(m=>addMsg({kind:'message.created',payload:m}));
  const mem = await j(`/groups/${id}/members`); MEMBERS=mem; renderMembers();
  if(ms.length){ const seen=LS('ht_seen',{}); seen[gid]=ms[ms.length-1].group_seq; SLS('ht_seen',seen); }
  connectWS(); loadConvs();
  if(TAB!=='msg') switchTab('msg');
}
async function refreshMembers(){ if(!gid) return; MEMBERS = await j(`/groups/${gid}/members`); renderMembers(); }
function renderMembers(q){
  const list = MEMBERS.filter(m=>!q||matchMember(m,q));
  const on = list.filter(m=>m.status!=='offline'), off = list.filter(m=>m.status==='offline');
  const row = m=>`<div class="mem" onclick="showCard(event,'${esc(m.name)}')">
    <div class="av ${m.kind==='agent'?'agent':''}">${esc(m.name[0]||'?')}<span class="dot"></span></div>
    <div>${esc(m.name)}${m.kind==='agent'?'<span class="tag">AI</span>':''}<small>${esc(m.persona||'')||(m.capabilities||[]).join(' · ')||(m.kind==='agent'?'Agent':'人类')}</small></div>
    <span class="more" onclick="memMenu(event,'${esc(m.name)}','${m.member_id}')">⋯</span></div>`;
  $('memtitle').textContent = `群成员 (${MEMBERS.length})`;
  $('memlist').innerHTML = (on.length?`<div class="memsec">在线 (${on.length})</div>`+on.map(row).join(''):'')
    + (off.length?`<div class="memsec">离线 (${off.length})</div>`+off.map(row).join(''):'');
}

// ---- WS ----
function connectWS(){
  if(ws){ ws.onclose=null; ws.close(); }
  ws = new WebSocket(`${API.replace('http','ws')}/ws/${gid}?last_seq=${lastSeq}`);
  ws.onopen = ()=>{ $('status').innerHTML='● <span class="on">已连接</span>'; };
  ws.onmessage = (ev)=>{ const e=JSON.parse(ev.data); if(e.seq<=lastSeq) return; lastSeq=e.seq; render(e); };
  ws.onclose = ()=>{ $('status').innerHTML='● <span style="color:#ef4444">断线，重连中…</span>'; setTimeout(connectWS,1000); };
}
function render(e){
  const p=e.payload;
  if(e.kind==='message.created'){ addMsg(e); touchConvPreview(p); }
  else if(e.kind==='route.decided') addSys(`路由裁决：${p.responders.length} 个应答者 · ${p.estimated_cost}`);
  else if(e.kind==='task.created') addSys(`任务入队：${p.title} → ${p.assignee}`);
  else if(e.kind==='run.started') addSys(`开始执行 run ${p.run_id.slice(0,6)}…`);
  else if(e.kind==='run.completed') addSys(`执行完成（待验收）：${p.result||''}`);
  else if(e.kind==='task.accepted') addSys(`任务已验收 ✔ by ${p.accepted_by}`);
  else if(e.kind==='budget.exceeded') addSys(`⛔ 预算超限强制停止：${p.agent_id} ${p.dimension}=${p.limit}`);
  else if(e.kind==='handoff.accepted') addSys(`结构化交接：${p.from} → ${(p.targets||[]).join('、')}`);
  else if(e.kind==='group.announcement_set'){ addSys(`📢 群公告已更新：${p.text}`); const g=GROUPS.find(x=>x.group_id===p.group_id); if(g) g.announcement={text:p.text,set_by:p.set_by}; renderAnnounce(); }
  else if(e.kind==='member.joined') { addSys(`${p.name} 加入了群聊`); refreshMembers(); }
  else if(e.kind==='member.left')   { addSys('成员已被移出群聊'); refreshMembers(); }
  else if(e.kind==='group.settings_set'){ addSys('群信息已更新'); const g=GROUPS.find(x=>x.group_id===p.group_id); if(g){ if(p.name)g.name=p.name; if(p.mode)g.mode=p.mode; } if(p.name) $('gname').textContent=g?g.name:''; if(p.mode) $('gsub').textContent=`群号: ${gid.slice(0,8).toUpperCase()} · ${modeCN(p.mode)}`; }
  else if(e.kind && e.kind.startsWith('approval.')) addSys(`审批${{requested:'已发起',approved:'已通过',refused:'已拒绝',executed:'已执行',expired:'已过期'}[e.kind.split('.')[1]]||e.kind}：${p.title||p.approval_id||''}`);
  else if(e.kind==='message.recalled'){ if(MSGS[p.message_id]) Object.assign(MSGS[p.message_id],{recalled:true,recalled_by:p.by,side_effect:p.side_effect}); if(p.group_id===gid) applyRecallDom(p.message_id); }
  else if(e.kind==='message.reacted'){ if(p.group_id===gid) setTimeout(()=>applyReactDom(p.message_id),50); }
  else if(e.kind==='message.pinned'||e.kind==='message.unpinned'){ if(p.group_id===gid) loadPins(); }
  if(e.kind==='message.created' && p.sender!==ME && p.sender!=='system') clearThinking();
}
function touchConvPreview(p){
  const el = document.querySelector(`#pane-msg .conv[onclick="openGroup('${gid}')"] .pv`);
  if(el) el.textContent = `${p.sender}: ${oneLine(p.text)}`;
}

// ---- 消息渲染 ----
let lastTimeCut=0, lastSender=null, lastSenderT=0;
function hl(text){ let s=esc(text); s=s.replace(/@([A-Za-z0-9_\u4e00-\u9fa5]+)/g,'<span class="at">@$1</span>'); return s.replace(/\n/g,'<br>'); }
const SE_CN={none:'仅隐藏文本',rolled_back:'副作用已回滚',irreversible:'⚠ 副作用无法回滚'};
function rxHtml(m){
  const rx=m.reactions||{}; const keys=Object.keys(rx).filter(k=>rx[k].length);
  if(!keys.length) return '';
  return `<div class="rx">${keys.map(k=>`<span class="rxchip ${rx[k].includes(ME)?'mine':''}" onclick="event.stopPropagation();reactTo('${m.message_id}','${k}')">${k}×${rx[k].length}</span>`).join('')}</div>`;
}
function attHtml(a){
  const url=`${API}/files/${a.file_id}`;
  if((a.mime||'').startsWith('image/')) return `<div class="att-img"><img src="${url}" alt="${esc(a.name)}" onclick="window.open('${url}')"></div>`;
  return `<div class="att-file"><span style="font-size:22px">📄</span><div><b>${esc(a.name)}</b><small>${fmtSize(a.size)}</small></div><a href="${url}" download="${esc(a.name)}">⬇</a></div>`;
}
function fmtSize(n){ return n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':(n||0)+' B'; }
function bubbleHtml(m){
  if(m.recalled) return `<div class="bubble recall-note">⚠️ 「${esc(oneLine(m.text))}」由 ${esc(m.recalled_by||'')} 撤回 · ${SE_CN[m.side_effect]||m.side_effect||''}</div>`;
  const q = m.reply_to && MSGS[m.reply_to] ? `<div class="quote" onclick="jumpMsg('${m.reply_to}')">回复 ${esc(MSGS[m.reply_to].sender)}: ${esc(oneLine(MSGS[m.reply_to].text))}</div>` : '';
  const atts = (m.attachments||[]).map(attHtml).join('');
  const body = atts + (m.text ? hl(m.text) : '');
  return `<div class="bubble" style="${atts&&!m.text?'padding:4px':''}" oncontextmenu="msgMenu(event,'${m.message_id}')">${q}${body}</div>${rxHtml(m)}`;
}
function pickFile(accept){
  if(!CUR){ toast('先选择一个会话'); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept=accept; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=async()=>{
    const f=inp.files[0]; inp.remove(); if(!f) return;
    if(f.size>10*1024*1024){ toast('文件超过 10MB'); return; }
    const b64=await new Promise(r=>{ const rd=new FileReader(); rd.onload=()=>r(rd.result.split(',')[1]); rd.readAsDataURL(f); });
    toast('上传中…');
    const meta=await jp('/files',{name:f.name,data_b64:b64,content_type:f.type});
    if(meta.error){ toast('上传失败: '+meta.error); return; }
    await jp(`/groups/${gid}/messages`,{sender:ME,text:'',idempotency_key:'att-'+Date.now(),
      attachments:[{file_id:meta.file_id,name:meta.name,size:meta.size,mime:meta.mime}]});
  };
  inp.click();
}
async function groupFiles(){
  if(!gid) return;
  const fs=await j(`/groups/${gid}/files`);
  const body = fs.length ? fs.map(a=>`<div class="att-file" style="margin:6px 0"><span style="font-size:22px">${(a.mime||'').startsWith('image/')?'🖼️':'📄'}</span><div><b>${esc(a.name)}</b><small>${fmtSize(a.size)}</small></div><a href="${API}/files/${a.file_id}" download="${esc(a.name)}">⬇</a></div>`).join('')
    : '<div style="color:#9aa1ab;text-align:center;padding:30px 0">暂无群文件</div>';
  openModal(`<h3>📁 群文件<span onclick="closeModals()">✕</span></h3><div class="mbody">${body}</div>`);
}
function addMsg(e){
  const p=e.payload; if(!p.message_id) return;
  MSGS[p.message_id]=p;
  const el=document.createElement('div');
  const t=tms(p.created_at);
  let cut=false;
  if(t && t-lastTimeCut>300000){ lastTimeCut=t; cut=true;
    const c=document.createElement('div'); c.className='msg sys';
    c.innerHTML=`<div class="bubble timecut">${new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}</div>`;
    $('msgs').appendChild(c);
  }
  const me=p.sender===ME, isAgent=!me&&p.sender!=='system';
  const cont=!cut && p.sender===lastSender && t && (t-lastSenderT)<300000 && !p.recalled;
  lastSender=p.sender; lastSenderT=t;
  el.className='msg'+(me?' me':'')+(isAgent?' agent':'')+(cont?' cont':'');
  el.dataset.mid=p.message_id;
  el.innerHTML=`<div class="avatar" onclick="showCard(event,'${esc(p.sender)}')">${me?'沣':'🤖'}</div><div class="c">
    <div class="who">${esc(p.sender)}${isAgent?'<span class="tag">AI</span>':''} <time>${hhmm(p.created_at)}</time><a class="more" onclick="msgMenu(event,'${p.message_id}')">⋯</a></div>
    ${bubbleHtml(p)}</div>`;
  $('msgs').appendChild(el); scroll();
}
function applyRecallDom(mid){
  const m=MSGS[mid]; if(!m) return;
  const el=document.querySelector(`.msg[data-mid="${mid}"]`); if(!el) return;
  el.querySelector('.c').innerHTML=`<div class="who">${esc(m.sender)} <time>${hhmm(m.created_at)}</time></div>${bubbleHtml(m)}`;
}
function applyReactDom(mid){
  const m=MSGS[mid]; if(!m) return;
  const el=document.querySelector(`.msg[data-mid="${mid}"]`); if(!el) return;
  const old=el.querySelector('.rx'); if(old) old.remove();
  const tmp=document.createElement('div'); tmp.innerHTML=rxHtml(m);
  if(tmp.firstChild) el.querySelector('.c').appendChild(tmp.firstChild);
}
function addSys(t){ const el=document.createElement('div'); el.className='msg sys'; el.innerHTML=`<div class="bubble">${esc(t)}</div>`; $('msgs').appendChild(el); scroll(); }
function scroll(){ const m=$('msgs'); m.scrollTop=m.scrollHeight; }
function jumpMsg(id){ const el=document.querySelector(`.msg[data-mid="${id}"]`); if(!el) return toast('原消息不在当前列表'); el.scrollIntoView({block:'center',behavior:'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

// ---- 消息菜单 / 引用 ----
function msgMenu(ev, mid){
  ev.preventDefault(); ev.stopPropagation();
  const m=MSGS[mid]||{};
  const pinned=(GROUPS.find(g=>g.group_id===gid)||{}).pins?.includes(mid);
  const items=['复制','回复','👍 赞同','✅ 完成','👀 收到','🙅 打回',pinned?'取消置顶':'置顶',`转发到${priv?'群':'会话'}`];
  if(m.sender===ME && !m.recalled) items.push('撤回');
  showCtx(ev, items, i=>{
    const t=items[i];
    if(t==='复制'){ navigator.clipboard.writeText(m.text||''); toast('已复制'); }
    if(t==='回复') setReply(mid);
    if(['👍 赞同','✅ 完成','👀 收到','🙅 打回'].includes(t)) reactTo(mid, t.split(' ')[0]);
    if(t==='置顶') pinMsg(mid);
    if(t==='取消置顶') unpinMsg(mid);
    if(t.startsWith('转发到')) forwardMsg(mid);
    if(t==='撤回') recallDialog(mid);
  });
}
async function reactTo(mid, emoji){
  await jp(`/groups/${gid}/messages/${mid}/react`,{member:ME,emoji});
  const m=MSGS[mid]; if(m){ const rx=m.reactions=m.reactions||{}; const l=rx[emoji]=rx[emoji]||[];
    const i=l.indexOf(ME); if(i>=0) l.splice(i,1); else l.push(ME); }
  applyReactDom(mid);
}
async function pinMsg(mid){ await jp(`/groups/${gid}/messages/${mid}/pin`,{by:ME}); loadPins(); toast('已置顶'); }
async function unpinMsg(mid){ await fetch(`${API}/groups/${gid}/messages/${mid}/pin`,{method:'DELETE'}); loadPins(); toast('已取消置顶'); }
let PIN_MID=null;
async function loadPins(){
  if(!gid){ return; }
  const ps=await j(`/groups/${gid}/pins`);
  const g=GROUPS.find(x=>x.group_id===gid); if(g) g.pins=ps.map(p=>p.message_id);
  PIN_MID = ps.length? ps[ps.length-1].message_id : null;
  $('pinbar').style.display = ps.length?'flex':'none';
  if(ps.length){ const p=ps[ps.length-1]; $('pintext').textContent=`${p.sender}: ${oneLine(p.text)}${ps.length>1?`（共 ${ps.length} 条）`:''}`; }
}
function recallDialog(mid){
  openModal(`<h3>撤回消息<span onclick="closeModals()">✕</span></h3><div class="mbody">
    <div style="font-size:13px;color:#57606c;margin-bottom:6px">「${esc(oneLine(MSGS[mid].text))}」</div>
    <label>副作用状态声明（红线：撤回≠回滚）</label>
    <select id="rse"><option value="none">仅隐藏文本（无副作用）</option><option value="rolled_back">副作用已回滚</option><option value="irreversible">副作用无法回滚</option></select></div>
    <div class="mfoot"><button onclick="closeModals()">取消</button><button class="pri" onclick="doRecall('${mid}')">撤回</button></div>`);
}
async function doRecall(mid){
  const se=$('rse').value;
  const r=await fetch(`${API}/groups/${gid}/messages/${mid}/recall`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({by:ME,side_effect:se})});
  closeModals();
  if(!r.ok){ toast((await r.json()).detail||'撤回失败'); return; }
  Object.assign(MSGS[mid],{recalled:true,recalled_by:ME,side_effect:se});
  applyRecallDom(mid);
}
function forwardMsg(mid){
  const m=MSGS[mid];
  const targets=GROUPS.filter(g=>g.group_id!==gid);
  if(!targets.length) return toast('没有其他会话可转发');
  openModal(`<h3>转发消息到<span onclick="closeModals()">✕</span></h3><div class="mbody">
    <div style="font-size:12px;color:#9aa1ab;margin-bottom:8px">「${esc(oneLine(m.text))}」</div>

async function send(){
  const t=$('text'); const v=t.value.trim(); if(!v||!gid) return;
  if(/@全体/.test(v)){
    const h=MEMBERS.filter(m=>m.kind==='human').length, a=MEMBERS.filter(m=>m.kind==='agent').length;
    if(!confirm(`@全体：将通知 ${h} 位人类 / 唤醒 ${a} 个 Agent（默认仅路由命中者应答）。确定发送？`)) return;
  }
  t.value=''; hideAt();
  const body={sender:ME,text:v,idempotency_key:'cli-'+Date.now()+'-'+Math.random().toString(16).slice(2)};
  if(REPLY) body.reply_to=REPLY.id;
  const r=await jp(`/groups/${gid}/messages`, body);
  if(r.route) addSys(`路由裁决：${r.route.responders.length} 个应答者 · ${r.route.estimated_cost}`);
  if(r.route && r.route.responders && r.route.responders.length) showThinking(r.route.responders.length);
  clearReply();
}
$('text').addEventListener('keydown', e=>{
  if($('atbox').style.display==='block'){
    if(e.key==='ArrowDown'){e.preventDefault();moveAt(1);return;}
    if(e.key==='ArrowUp'){e.preventDefault();moveAt(-1);return;}
    if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();pickAt(atIdx);return;}
    if(e.key==='Escape'){hideAt();return;}
  }
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
$('text').addEventListener('input', updateAt);
$('text').addEventListener('keyup', e=>{ if(!['ArrowDown','ArrowUp','Enter','Tab','Escape'].includes(e.key)) updateAt(); });

// ---- @成员选择器 ----
let atIdx=0, atItems=[];
function atQuery(){
  const t=$('text'), pos=t.selectionStart, before=t.value.slice(0,pos);
  const m=before.match(/@([A-Za-z0-9_\u4e00-\u9fa5]*)$/);
  return m?{q:m[1],start:m.index,end:pos}:null;
}
function updateAt(){
  const a=atQuery();
  if(!a){ hideAt(); return; }
  atItems=MEMBERS.filter(m=>m.name!==ME&&matchMember(m,a.q));
  if(!atItems.length){ hideAt(); return; }
  atIdx=Math.min(atIdx,atItems.length-1);
  $('atbox').innerHTML=atItems.map((m,i)=>
    `<div class="it ${i===atIdx?'sel':''}" onmousedown="event.preventDefault();pickAt(${i})">
      <div class="av ${m.kind==='agent'?'agent':''}">${esc(m.name[0]||'?')}</div>
      <div>${esc(m.name)}${m.kind==='agent'?'<span class="tag">AI</span>':''}</div>
      <small>${esc(m.persona||m.task||(m.kind==='agent'?'Agent':'人类'))}</small></div>`).join('');
  $('atbox').style.display='block';
}
function moveAt(d){ atIdx=(atIdx+d+atItems.length)%atItems.length; updateAtRefresh(); }
function updateAtRefresh(){
  $('atbox').querySelectorAll('.it').forEach((x,i)=>x.classList.toggle('sel',i===atIdx));
}
function hideAt(){ $('atbox').style.display='none'; atIdx=0; }
function pickAt(i){
  const a=atQuery(), m=atItems[i]; if(!a||!m) return;
  const t=$('text');
  t.value=t.value.slice(0,a.start)+'@'+m.name+' '+t.value.slice(a.end);
  hideAt(); t.focus();
}

  card.style.display='block';
  card.style.left=Math.max(8,Math.min(ev.clientX,innerWidth-312))+'px';
  card.style.top=Math.max(8,Math.min(ev.clientY,innerHeight-300))+'px';
}
function quickMsg(name){ const t=$('text'); t.value+=`@${name} `; t.focus(); $('card').style.display='none'; }
function closeModals(){ $('mask').style.display='none'; }
function openModal(html){ $('modal').innerHTML=html; $('mask').style.display='flex'; }
function editPersona(name){
  const m=memberOf(name); if(!m) return toast('仅群成员可设置'); $('card').style.display='none'; $('mask').style.display='none';
  openModal(`<h3>编辑签名 · ${esc(name)}<span onclick="closeModals()">✕</span></h3>
    <div class="mbody"><label>人格设定（每次委派自动注入）</label>
    <textarea id="pf" rows="4">${esc(m.persona||'')}</textarea>
    <label>职责 / 任务设定</label><input id="tf" value="${esc(m.task||'')}"></div>
    <div class="mfoot"><button onclick="closeModals()">取消</button><button class="pri" onclick="savePersona('${esc(name)}','${m.member_id}')">保存</button></div>`);
}
async function savePersona(name,mid){
  await jp(`/groups/${gid}/members/${mid}/persona`,{persona:$('pf').value.trim(),task:$('tf').value.trim()});
  closeModals(); await refreshMembers(); toast('已保存');
}
async function showMemory(name){
  $('card').style.display='none'; $('mask').style.display='none';
  const items=await j(`/groups/${gid}/agents/${encodeURIComponent(name)}/memory`);
  openModal(`<h3>${esc(name)} 的记忆（本群独立）<span onclick="closeModals()">✕</span></h3>
    <div class="mbody">${items.length? items.map(x=>
      `<div class="memrow"><div class="tx">${esc(x.text)}</div><div class="del" title="遗忘" onclick="forgetMem('${esc(name)}','${x.memory_id}')">✕</div></div>`).join('')
      : '<div style="color:#9aa1ab;font-size:13px;padding:8px 0">还没有记忆，添加一条吧~</div>'}
    <div class="memadd"><input id="mnew" placeholder="让 TA 记住…" onkeydown="if(event.key==='Enter')rememberMem('${esc(name)}')">
    <button class="btn-s pri" onclick="rememberMem('${esc(name)}')">记住</button></div></div>`);
}
async function rememberMem(name){
  const v=$('mnew').value.trim(); if(!v) return;
  await jp(`/groups/${gid}/agents/${encodeURIComponent(name)}/memory`,{text:v});
  showMemory(name);
}
async function forgetMem(name,mid){
  await fetch(`${API}/groups/${gid}/agents/${encodeURIComponent(name)}/memory/${mid}`,{method:'DELETE'});
  showMemory(name);
}

// ---- 启动 ----
(async function boot(){
  await Promise.all([loadConvs(), loadFriends()]);
  setInterval(()=>{ if(document.visibilityState==='visible') loadConvs(); }, 10000);
})();
</script>
</body>
</html>
