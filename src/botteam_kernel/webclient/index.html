<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hetu Team</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
<style>
:root{--qqbar:#20293a;--list:#f3f4f6;--list-sel:#d9dee6;--chat:#f5f6f7;--border:#e2e4e8;--me:#b9dcff;--txt:#171b21;--sub:#9aa1ab;--qq:#12b7f5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 -apple-system,"PingFang SC",sans-serif;color:var(--txt);display:flex;overflow:hidden;background:var(--chat)}
/* ① 最左深色图标栏 */
#iconbar{width:56px;background:var(--qqbar);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:18px;flex:none}
#iconbar .me-avatar{width:36px;height:36px;border-radius:8px;overflow:hidden;flex:none}
#iconbar .me-avatar img{width:100%;height:100%;object-fit:cover}
#iconbar .brand{color:#8a93a5;font-size:10px;writing-mode:vertical-rl;letter-spacing:2px;margin-top:auto;padding-bottom:10px}
#iconbar .tab{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#8a93a5;cursor:pointer}
#iconbar .tab.on{background:#33405a;color:#fff}
/* ② 会话列表 */
#list{width:260px;background:var(--list);border-right:1px solid var(--border);display:flex;flex-direction:column;flex:none}
#list .top{padding:12px 14px;display:flex;align-items:center;gap:8px}
#list .top input{flex:1;border:0;border-radius:4px;background:#e4e6ea;padding:5px 9px;font:inherit;font-size:12px;color:var(--sub)}
#list .top .add{width:24px;height:24px;border-radius:4px;background:#e4e6ea;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#556}
#convs{flex:1;overflow-y:auto}
.conv{display:flex;gap:10px;padding:11px 12px;cursor:pointer;position:relative}
.conv:hover{background:#e9ebef}
.conv.active{background:var(--list-sel)}
.conv .av{width:40px;height:40px;border-radius:6px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.conv .av.agent{background:#ffb266}
.conv .mid{flex:1;min-width:0}
.conv .nm{display:flex;justify-content:space-between;font-size:14px}
.conv .nm time{color:var(--sub);font-size:11px;font-weight:normal}
.conv .pv{color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .badge{position:absolute;top:9px;right:38px;min-width:17px;height:17px;border-radius:9px;background:#fa5151;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;padding:0 4px}
/* ③ 聊天区 */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#head{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0 18px;gap:10px;flex:none;position:relative}
#head b{font-size:16px}
#head .mode{font-size:12px;color:var(--sub)}
#head .rightbox{position:absolute;right:16px;display:flex;align-items:center;gap:14px;color:#6b7280}
#head .tools{display:flex;gap:14px}
#head .tools span{cursor:pointer;font-size:16px}
#status{font-size:12px;color:var(--sub)}
#status .on{color:#22c55e}
#msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:10px;max-width:76%}
.msg .avatar{width:40px;height:40px;border-radius:6px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.msg.agent .avatar{background:#ffb266}
.msg .who{font-size:12px;color:var(--sub);margin-bottom:3px}
.msg .who .tag{background:#fff1e6;color:#d46b08;border-radius:3px;padding:0 4px;margin-left:4px;font-size:11px}
.bubble{background:#fff;border-radius:8px;padding:9px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word;position:relative}
.msg:not(.me):not(.sys) .bubble::before{content:'';position:absolute;left:-4px;top:13px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-radius:2px}
.msg.me .bubble::before{content:'';position:absolute;right:-4px;top:13px;width:10px;height:10px;background:var(--me);transform:rotate(45deg);border-radius:2px}
.timecut{align-self:center;color:var(--sub);font-size:11px;background:transparent;box-shadow:none;padding:2px 6px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .who{text-align:right}
.msg.me .avatar{background:#52b788}
.msg.me .bubble{background:var(--me)}
.msg.sys{align-self:center;max-width:90%}
.msg.sys .bubble{background:#eceff3;color:var(--sub);font-size:12px;box-shadow:none}
/* 输入区 */
#inputwrap{background:#fff;border-top:1px solid var(--border);flex:none}
#toolbar{height:38px;display:flex;align-items:center;gap:16px;padding:0 14px;color:#6b7280;font-size:16px;border-bottom:1px solid #f0f1f3}
#text{width:100%;border:0;padding:10px 14px;resize:none;height:88px;font:inherit;outline:none}
#sendrow{display:flex;justify-content:flex-end;padding:6px 14px 12px}
#sendrow button{border:0;border-radius:4px;background:#fff;color:#333;font:inherit;padding:5px 22px;cursor:pointer;border:1px solid #d5d8dd}
#sendrow button:hover{color:var(--qq);border-color:var(--qq)}
/* ④ 群成员侧栏 */
#members{width:200px;background:#fff;border-left:1px solid var(--border);overflow-y:auto;flex:none}
#members.hidden{display:none}
#members h2{font-size:13px;padding:14px;color:var(--sub);border-bottom:1px solid #f0f1f3}
.mem{padding:8px 14px;display:flex;align-items:center;gap:8px}
.mem .av{width:28px;height:28px;border-radius:5px;background:#7aa5ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;position:relative}
.mem .av.agent{background:#ffb266}
.mem .av .dot{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;background:#22c55e;border:2px solid #fff}
.mem small{color:var(--sub);display:block;font-size:11px}
.mem .tag{background:#fff1e6;color:#d46b08;border-radius:3px;padding:0 4px;margin-left:4px;font-size:11px}
</style>
</head>
<body>
<div id="iconbar">
  <div class="me-avatar" title="Hetu Team · HongYun Lab"><img src="logo.jpg" alt="Hetu Team"></div>
  <div class="tab on" title="消息">💬</div>
  <div class="tab" title="联系人">👥</div>
  <div class="brand">HongYun Lab</div>
</div>
<div id="list">
  <div class="top"><input placeholder="搜索" disabled><div class="add" onclick="newGroup()" title="新建群">＋</div></div>
  <div id="convs"></div>
</div>
<div id="main">
  <div id="head"><b id="gname">—</b><span class="mode" id="gmode"></span>
    <span class="rightbox"><span class="tools"><span title="群成员" onclick="toggleMembers()">👤</span></span><span id="status">● <span class="on">连接中</span></span></span>
  </div>
  <div id="msgs"></div>
  <div id="inputwrap">
    <div id="toolbar"><span title="表情">😀</span><span title="图片">🖼️</span><span title="文件">📁</span><span title="记录">🕘</span></div>
    <textarea id="text" placeholder="输入消息，Enter 发送（@全体Agent 仅路由命中者应答）"></textarea>
    <div id="sendrow"><button onclick="send()">发送(S)</button></div>
  </div>
</div>
<div id="members"><h2 id="memtitle">群成员</h2><div id="memlist"></div></div>
<script>
const API = new URLSearchParams(location.search).get('server') || 'http://10.66.10.2:8877';
const ME = '沣锅';
let gid = null, lastSeq = 0, ws = null;

async function j(url, opt){ const r = await fetch(API+url, opt); return r.json(); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hhmm(t){ if(!t) return ''; const d = new Date(t); return isNaN(d)?'':`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

async function boot(){
  let gs = await j('/groups');
  if(!gs.length){ const g = await j('/groups', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'Hetu 研发群',mode:'default_single'})}); gs=[g]; }
  const items = [];
  for(const g of gs){
    const ms = await j(`/groups/${g.group_id}/messages`);
    const last = ms[ms.length-1];
    items.push({g, pv: last ? `${last.sender}: ${last.text}` : '（暂无消息）', t: last ? last.created_at : ''});
  }
  document.getElementById('convs').innerHTML = items.map(({g,pv,t}) =>
    `<div class="conv ${g.group_id===gid?'active':''}" onclick="openGroup('${g.group_id}')">
      <div class="av">${esc(g.name[0]||'群')}</div>
      <div class="mid"><div class="nm"><b>${esc(g.name)}</b><time>${hhmm(t)}</time></div>
      <div class="pv">${esc(pv)}</div></div></div>`).join('');
  if(!gid) openGroup(gs[0].group_id);
}

async function newGroup(){
  const name = prompt('群名称'); if(!name) return;
  const g = await j('/groups', {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,mode:'default_single'})});
  gid = g.group_id; boot();
}

async function openGroup(id){
  gid = id; lastSeq = 0; lastTimeCut = 0; document.getElementById('msgs').innerHTML='';
  const gs = await j('/groups'); const g = gs.find(x=>x.group_id===id);
  document.getElementById('gname').textContent = g ? g.name : id;
  document.getElementById('gmode').textContent = '';
  boot();
  const ms = await j(`/groups/${id}/messages`);
  ms.forEach(m=>addMsg({kind:'message.created',payload:m}));
  const mem = await j(`/groups/${id}/members`);
  document.getElementById('memtitle').textContent = `群成员 (${mem.length})`;
  document.getElementById('memlist').innerHTML = mem.map(m=>
    `<div class="mem"><div class="av ${m.kind==='agent'?'agent':''}">${esc(m.name[0]||'?')}<span class="dot"></span></div>
     <div>${esc(m.name)}${m.kind==='agent'?'<span class="tag">AI</span>':''}<small>${(m.capabilities||[]).join(' · ')||'人类'}</small></div></div>`).join('');
  connectWS();
}

function toggleMembers(){ document.getElementById('members').classList.toggle('hidden'); }

function connectWS(){
  if(ws){ ws.onclose=null; ws.close(); }
  ws = new WebSocket(`${API.replace('http','ws')}/ws/${gid}?last_seq=${lastSeq}`);
  ws.onopen = ()=>{ document.getElementById('status').innerHTML='● <span class="on">已连接</span>'; };
  ws.onmessage = (ev)=>{ const e = JSON.parse(ev.data); if(e.seq<=lastSeq) return; lastSeq=e.seq; render(e); };
  ws.onclose = ()=>{ document.getElementById('status').innerHTML='● <span style="color:#ef4444">断线，重连中…</span>'; setTimeout(connectWS, 1000); };
}

function render(e){
  const p = e.payload;
  if(e.kind==='message.created') addMsg(e);
  else if(e.kind==='route.decided') addSys(`路由裁决：${p.responders.length} 个应答者 · ${p.estimated_cost}`);
  else if(e.kind==='task.created') addSys(`任务入队：${p.title} → ${p.assignee}`);
  else if(e.kind==='run.started') addSys(`开始执行 run ${p.run_id.slice(0,6)}…`);
  else if(e.kind==='run.completed') addSys(`执行完成（待验收）：${p.result||''}`);
  else if(e.kind==='task.accepted') addSys(`任务已验收 ✔ by ${p.accepted_by}`);
  else if(e.kind==='budget.exceeded') addSys(`⛔ 预算超限强制停止：${p.agent_id} ${p.dimension}=${p.limit}`);
}

let lastTimeCut = 0;
function addMsg(e){
  const p = e.payload; const el = document.createElement('div');
  const t = p.created_at ? new Date(p.created_at).getTime() : 0;
  if(t && t - lastTimeCut > 180000){ lastTimeCut = t;
    const c = document.createElement('div'); c.className='msg sys';
    c.innerHTML = `<div class="bubble timecut">${new Date(t).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}</div>`;
    document.getElementById('msgs').appendChild(c);
  }
  const me = p.sender===ME;
  const isAgent = !me && p.sender!=='system';
  el.className = 'msg'+(me?' me':'')+(isAgent?' agent':'');
  el.innerHTML = `<div class="avatar">${me?'沣':'🤖'}</div><div>
    <div class="who">${esc(p.sender)}${isAgent?'<span class="tag">AI</span>':''} ${hhmm(p.created_at)}</div>
    <div class="bubble">${esc(p.text)}</div></div>`;
  document.getElementById('msgs').appendChild(el); scroll();
}
function addSys(t){ const el=document.createElement('div'); el.className='msg sys'; el.innerHTML=`<div class="bubble">${esc(t)}</div>`; document.getElementById('msgs').appendChild(el); scroll(); }
function scroll(){ const m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight; }

async function send(){
  const t = document.getElementById('text'); const v = t.value.trim(); if(!v||!gid) return;
  t.value='';
  const key = 'cli-'+Date.now()+'-'+Math.random().toString(16).slice(2);
  const r = await j(`/groups/${gid}/messages`, {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sender:ME,text:v,idempotency_key:key})});
  if(r.route) addSys(`路由裁决：${r.route.responders.length} 个应答者 · ${r.route.estimated_cost}`);
}
document.getElementById('text').addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
boot();
</script>
</body>
</html>
